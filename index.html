<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff79ad">
<title>Chúc mừng sinh nhật Như Ý 💗</title>
<style>
        :root {
            --pink: #ff5f9d;
            --deep: #b92c69;
            --light: #fff1f7
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            color: #793253;
            background: radial-gradient(circle at 10% 10%, #fff 0, transparent 40%), linear-gradient(145deg, #ffe1ef, #ffd0e6 50%, #fff4fa);
            min-height: 100dvh;
            overflow-x: hidden
        }

        .wrap {
            max-width: 780px;
            margin: auto;
            padding: 24px 18px 80px;
            text-align: center;
            position: relative;
            z-index: 1
        }

        .card {
            background: #ffffffc9;
            backdrop-filter: blur(14px);
            border: 1px solid #fff;
            border-radius: 30px;
            box-shadow: 0 18px 55px #c8437930;
            padding: 24px 16px;
            margin: 16px 0
        }

        .tag {
            display: inline-block;
            background: #fff;
            color: var(--deep);
            padding: 8px 16px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px
        }

        h1 {
            font-size: clamp(34px, 8vw, 62px);
            line-height: 1.1;
            color: var(--deep);
            margin: 16px 0;
            text-shadow: 2px 3px #fff
        }

        h2 {
            font-size: clamp(23px, 5vw, 35px);
            color: var(--deep)
        }

        .name {
            color: #f03787
        }

        .wish {
            font-size: clamp(18px, 4.5vw, 24px);
            line-height: 1.65;
            white-space: pre-wrap
        }

        .heart {
            font-size: 30px;
            animation: beat 1s infinite alternate
        }

        @keyframes beat {
            to {
                transform: scale(1.22)
            }
        }

        button {
            border: 0;
            border-radius: 99px;
            padding: 13px 19px;
            margin: 6px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff65a5, #ef3582);
            color: white;
            font-weight: 750;
            font-size: 15px;
            box-shadow: 0 7px 18px #f05c9444
        }

        button.secondary {
            background: #fff;
            color: var(--deep);
            border: 1px solid #ffbad6;
            box-shadow: none
        }

        .cake {
            position: relative;
            width: 240px;
            height: 225px;
            margin: 24px auto 8px;
            filter: drop-shadow(0 15px 12px #cc54864a)
        }

        .plate {
            position: absolute;
            bottom: 0;
            left: 12px;
            width: 216px;
            height: 24px;
            background: #fff;
            border: 5px solid #f8a8c7;
            border-radius: 50%
        }

        .layer {
            position: absolute;
            left: 35px;
            width: 170px;
            height: 68px;
            border-radius: 15px;
            background: linear-gradient(#ff99bf, #ff5e99);
            border-bottom: 8px solid #f54485
        }

        .layer.bottom {
            bottom: 16px
        }

        .layer.top {
            bottom: 75px;
            background: linear-gradient(#ffc1d9, #ff8eb7)
        }

        .icing {
            position: absolute;
            bottom: 127px;
            left: 35px;
            width: 170px;
            height: 25px;
            border-radius: 50%;
            background: #fff8fb;
            box-shadow: 0 7px #fff8fb
        }

        .candle {
            position: absolute;
            bottom: 150px;
            left: 111px;
            width: 17px;
            height: 44px;
            border-radius: 4px;
            background: repeating-linear-gradient(45deg, #fff 0 7px, #ff70a8 7px 13px)
        }

        .flame {
            position: absolute;
            bottom: 194px;
            left: 113px;
            width: 13px;
            height: 23px;
            background: #ffbd38;
            border-radius: 80% 0 80% 80%;
            transform: rotate(-45deg);
            box-shadow: 0 0 18px #ffb72e;
            animation: flicker .35s infinite alternate
        }

        @keyframes flicker {
            to {
                transform: rotate(-40deg) scale(.85)
            }
        }

        .balloon {
            position: fixed;
            bottom: -120px;
            width: 58px;
            height: 74px;
            border-radius: 50% 50% 48% 48%;
            opacity: .7;
            z-index: 0;
            animation: rise linear infinite;
            pointer-events: none
        }

        .balloon:after {
            content: '';
            position: absolute;
            top: 74px;
            left: 28px;
            height: 100px;
            border-left: 1px solid #d988aa
        }

        @keyframes rise {
            to {
                transform: translateY(-130vh) rotate(12deg)
            }
        }

        .gift {
            font-size: 100px;
            display: block;
            cursor: pointer;
            animation: bob 2s ease-in-out infinite;
            user-select: none
        }

        @keyframes bob {
            50% {
                transform: translateY(-12px)
            }
        }

        .hidden {
            display: none !important
        }

        .surprise {
            background: #fff0f7;
            border: 2px dashed #ff8cba;
            border-radius: 24px;
            padding: 22px;
            margin: 16px auto;
            max-width: 500px;
            font-size: 22px;
            line-height: 1.6
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center
        }

        .footer {
            font-size: 13px;
            color: #a36584;
            margin-top: 22px
        }

        @media(prefers-reduced-motion:reduce) {

            *,
            *:before,
            *:after {
                animation-duration: .01ms !important
            }
        }
    
.gift-photo {display:block;width:min(100%,320px);max-height:390px;object-fit:cover;border-radius:22px;border:5px solid white;box-shadow:0 12px 28px #d45a8b55;margin:16px auto;animation:photoAppear .8s ease}
@keyframes photoAppear {from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
.surprise p{white-space:pre-wrap}.photo-empty{padding:14px;background:white;border-radius:12px;font-size:14px}</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<div id="balloons"></div>
<main class="wrap">
  <div class="tag">💌 NGUYỄN VĂN HANH 💌</div>
  <section class="card">
    <div class="heart">💗</div>
    <h1>Happy Birthday!</h1>
    <h2> <span class="name" id="nameDisplay">Hà Thị Như Ý</span> 🎀</h2>
    <div class="cake" aria-label="Bánh kem sinh nhật">
      <div class="plate"></div><div class="layer bottom"></div>
      <div class="layer top"></div><div class="icing"></div>
      <div class="candle"></div><div class="flame"></div>
    </div>
    <p class="wish" id="wishDisplay"></p>
    <div class="toolbar">
      <button id="fireBtn">🎆 Bắn pháo hoa</button>
      <button id="musicBtn" class="secondary">🎵 Bật nhạc</button>
    </div>
  </section>
  <section class="card">
    <h2>🎁 Có một món quà dành cho bé</h2>
    <div class="gift" id="gift" role="button" tabindex="0" aria-label="Mở quà">🎁</div>
    <p>Mở hộp quà đi bé!</p>
    <div class="surprise hidden" id="surprise">
      <h2> 💝 Chúc bé yêu sinh nhật vui vẻ, ngày càng xinh đẹp, kiếm được nhiều tiền để nuôi chồng nhé! 💕 </h2>
      <img id="giftPhoto" class="gift-photo" src="assets/nhu-y.jpg" alt="Ảnh kỷ niệm Như Ý" hidden>
      <div id="photoHint" class="photo-empty" hidden>📷 Để hiện ảnh, hãy đặt file <b>nhu-y.jpg</b> vào thư mục <b>assets</b>.</div>
      <p id="surpriseText"></p>
    </div>
  </section>
  <p class="footer">I LOVE NHƯ Ý</p>
</main>

<audio id="birthdayMusic" src="assets/nhac-sinh-nhat.mp3" preload="none" loop></audio>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  // CHỈNH SỬA TÊN VÀ LỜI CHÚC TẠI ĐÂY (lưu file rồi tải lại trang).
  const content = {
    name: 'Hà Thị Như Ý',
    wish: 'Chúc bé yêu sinh nhật vui vẻ <3',
    surprise: '💗YÊU BÉ ! Nhắm mắt lại đi 💗 '
  };
  $('nameDisplay').textContent = content.name;
  $('wishDisplay').textContent = content.wish;
  $('surpriseText').textContent = content.surprise;
  document.title = 'Sinh nhật ' + content.name + ' 💗';

  // Ảnh trong hộp quà. Nếu chưa chép ảnh, hiển thị lời hướng dẫn.
  const photo = $('giftPhoto');
  photo.onload = () => {photo.hidden=false;$('photoHint').hidden=true;};
  photo.onerror = () => {photo.hidden=true;$('photoHint').hidden=false;};
  if (photo.complete) {
    if (photo.naturalWidth) photo.onload(); else photo.onerror();
  }
  $('gift').onclick = () => {$('surprise').classList.toggle('hidden');fire(80);};
  $('gift').onkeydown = event => {
    if (event.key === 'Enter' || event.key === ' ') {event.preventDefault();$('gift').click();}
  };
  // Bóng bay và pháo hoa
  const colors=['#ff6eaa','#ffb4d0','#f8d6ff','#ffa9bc','#ff86bf'];
  for(let i=0;i<13;i++) {
    const balloon=document.createElement('div'); balloon.className='balloon';
    balloon.style.left=(i*7.9+Math.random()*4)+'%';
    balloon.style.background=colors[i%colors.length];
    balloon.style.animationDuration=(12+Math.random()*12)+'s';
    balloon.style.animationDelay=(-Math.random()*25)+'s';
    $('balloons').appendChild(balloon);
  }
  const canvas=$('fireworks'),ctx=canvas.getContext('2d');
  let particles=[],animating=false;
  function resize() {
    const dpr=window.devicePixelRatio||1;
    canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  addEventListener('resize',resize);resize();
  function fire(count=120) {
    for(let i=0;i<count;i++) {
      const angle=Math.random()*Math.PI*2,speed=1.2+Math.random()*5;
      particles.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*(.12+Math.random()*.45),vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:65+Math.random()*40,color:colors[Math.floor(Math.random()*colors.length)]});
    }
    if(!animating){animating=true;requestAnimationFrame(tick);}
  }
  function tick() {
    ctx.clearRect(0,0,innerWidth,innerHeight);
    particles=particles.filter(p=>p.life-->0);
    for(const p of particles) {
      p.x+=p.vx;p.y+=p.vy;p.vy+=.055;
      ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    if(particles.length)requestAnimationFrame(tick);else animating=false;
  }
  $('fireBtn').onclick=()=>fire(160);
  // Nhạc MP3 riêng: chép assets/nhac-sinh-nhat.mp3
  const music=$('birthdayMusic');
  const musicBtn=$('musicBtn');
  musicBtn.onclick=async()=>{
    if(!music.paused){music.pause();musicBtn.textContent='🎵 Bật nhạc';return;}
    try {await music.play();musicBtn.textContent='⏸ Tắt nhạc';}
    catch(error){alert('Chưa phát được nhạc. Hãy chép file nhac-sinh-nhat.mp3 vào thư mục assets và thử lại.');}
  };
  music.onended=()=>musicBtn.textContent='🎵 Bật nhạc';
  setTimeout(()=>fire(75),650);
})();
</script>
</body>
</html>
